plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	mavenCentral()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:5.14.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

sourceSets {
	tools {
		java.srcDirs = ["tools"]
		resources.srcDirs = []
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

test {
	useJUnitPlatform()
}

interface InjectedExecOps {
	@javax.inject.Inject
	ExecOperations getExecOps()
}

tasks.register("checkReplay") {
	group = "verification"
	def execOps = objects.newInstance(InjectedExecOps).execOps
	def toolsClasspath = sourceSets.tools.runtimeClasspath
	def replay = providers.gradleProperty("replay")
	def dir = projectDir
	dependsOn "toolsClasses"
	doLast {
		def failed = ["Inspect", "Setup", "Motion", "Swing", "Boundary"].findAll { tool ->
			println "\n== $tool"
			execOps.javaexec {
				classpath = toolsClasspath
				mainClass = tool
				args replay.get()
				workingDir = dir
				ignoreExitValue = true
			}.exitValue != 0
		}
		if (!failed.isEmpty()) {
			throw new GradleException("Replay checks failed: " + failed.join(", "))
		}
	}
}

tasks.register("runTool", JavaExec) {
	classpath = sourceSets.tools.runtimeClasspath
	mainClass = providers.gradleProperty("tool")
	setArgsString(providers.gradleProperty("args").getOrElse(""))
	workingDir = projectDir
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Momenton must never call OpenGL directly: every GPU operation goes through
// com.mojang.blaze3d so the mod keeps working under VulkanMod, and under Mojang's
// own Vulkan backend when it lands. This guard exists so that rule cannot erode quietly.
tasks.register("checkNoDirectOpenGl") {
	def sourceDir = file("src/main/java")
	inputs.dir(sourceDir)
	doLast {
		def offenders = fileTree(sourceDir) { include "**/*.java" }
			.filter { it.text.contains("org.lwjgl.opengl") }
			.files
		if (!offenders.isEmpty()) {
			def names = offenders.collect { sourceDir.toPath().relativize(it.toPath()).toString() }
			throw new GradleException(
				"Direct OpenGL usage is forbidden because it breaks VulkanMod. Use com.mojang.blaze3d instead.\nOffending files:\n  " + names.join("\n  "))
		}
	}
}

tasks.named("check") {
	dependsOn "checkNoDirectOpenGl", "toolsClasses"
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
